
name: Build DriveDeck APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find project folder
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f DriveDeck/settings.gradle.kts ]; then
            echo "PROJECT_DIR=DriveDeck" >> "$GITHUB_ENV"
          else
            echo "Cannot find settings.gradle.kts"
            exit 1
          fi

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            DriveDeck/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
