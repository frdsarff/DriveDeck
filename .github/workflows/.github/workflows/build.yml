
name: Build DriveDeck APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DriveDeck-AndroidAuto-Starter.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          unzip -q DriveDeck-AndroidAuto-Starter.zip -d /tmp/drivedeck
          test -f /tmp/drivedeck/DriveDeck/settings.gradle.kts

      - name: Build APK
        working-directory: /tmp/drivedeck/DriveDeck
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveDeck-debug-apk
          path: /tmp/drivedeck/DriveDeck/app/build/outputs/apk/debug/app-debug.apk
