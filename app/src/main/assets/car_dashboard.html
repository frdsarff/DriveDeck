<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DriveDeck Car</title>
<style>
:root{color-scheme:dark;--bg:#080c13;--panel:#111a26;--line:#293748;--mint:#57f0c3;--muted:#9aa9ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5f8fc;font:16px system-ui,Roboto,sans-serif}
body{background:radial-gradient(ellipse at 16% 5%,#23404b 0,transparent 45%),radial-gradient(ellipse at 100% 90%,#173b39 0,transparent 38%),var(--bg)}
main{height:100%;padding:3.4vh 3vw;display:grid;grid-template-rows:auto minmax(0,1.2fr) minmax(0,.8fr) auto;gap:2vh}
header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#70f6cc,#188c91);color:#06131a;display:grid;place-items:center;font-weight:900;font-size:22px}.name{font-weight:850;letter-spacing:.12em;font-size:17px}.tag{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:3px}.online{font-size:11px;color:var(--mint);border:1px solid #2b514d;border-radius:99px;padding:8px 12px}
.card{min-height:0;border:1px solid var(--line);border-radius:24px;background:linear-gradient(130deg,#172330ed,#101620f2);padding:2.5vh 2.2vw;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--mint);font-weight:800}.player{height:calc(100% - 18px);display:grid;grid-template-columns:minmax(150px,27%) 1fr;gap:2vw;align-items:center}.art{width:100%;aspect-ratio:1;max-height:100%;border-radius:20px;display:grid;place-items:center;background:linear-gradient(140deg,#2b4255,#101620);border:1px solid #ffffff18;overflow:hidden;color:var(--mint);font-size:clamp(38px,6vh,74px)}.art img{width:100%;height:100%;object-fit:cover}.meta{min-width:0}h1{font-size:clamp(21px,3.2vh,38px);margin:0 0 8px;line-height:1.1;overflow-wrap:anywhere}.artist{font-size:clamp(14px,1.9vh,22px);color:#b4c1d0}.source{font-size:10px;letter-spacing:.14em;color:var(--mint);margin-top:12px}.progress{height:5px;border-radius:9px;background:#344151;margin-top:2.2vh;overflow:hidden}.bar{height:100%;width:0;background:var(--mint);border-radius:9px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}.controls{display:flex;gap:12px;align-items:center;margin-top:1.6vh}.btn{width:clamp(42px,6vh,60px);height:clamp(42px,6vh,60px);border-radius:50%;border:1px solid #344253;background:#1a2634;color:#fff;font-size:20px;display:grid;place-items:center}.btn.play{width:clamp(52px,7vh,70px);height:clamp(52px,7vh,70px);background:var(--mint);color:#06131a;border:0}
.lyrics{display:flex;flex-direction:column;justify-content:center;gap:1.1vh;height:calc(100% - 18px);overflow:hidden}.line{font-size:clamp(16px,2.7vh,30px);font-weight:650;color:#738195;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.line.active{font-size:clamp(22px,3.8vh,43px);color:#fff;font-weight:850}.line.next{color:#bac6d4}.bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.12em}
@media(max-aspect-ratio:1.25/1){main{padding:2vh 3vw;gap:1.5vh}.player{grid-template-columns:25% 1fr}.card{padding:2vh 2vw}}
</style>
</head>
<body>
<main>
<header><div class="brand"><div class="logo">D</div><div><div class="name">DRIVEDECK</div><div class="tag">MUSIC • LYRICS • DRIVE</div></div></div><div class="online" id="connection">● WAITING FOR MEDIA</div></header>
<section class="card"><div class="eyebrow">NOW PLAYING</div><div class="player"><div class="art" id="art">♫</div><div class="meta"><h1 id="title">Waiting for music…</h1><div class="artist" id="artist">Start Spotify or YouTube Music</div><div class="source" id="source">MEDIA SESSION NOT CONNECTED</div><div class="progress"><div class="bar" id="bar"></div></div><div class="times"><span id="elapsed">LIVE SESSION</span><span id="duration">READY</span></div><div class="controls"><button class="btn" aria-label="Previous" onclick="action('previous')">|◀</button><button class="btn play" id="play" aria-label="Play or pause" onclick="action('playPause')">▶</button><button class="btn" aria-label="Next" onclick="action('next')">▶|</button></div></div></div></section>
<section class="card"><div class="eyebrow">SYNCED LYRICS</div><div class="lyrics" id="lyrics"><div class="line active">Your lyrics will appear here</div><div class="line next">Play a song to begin</div><div class="line">DriveDeck</div></div></section>
<footer class="bottom"><span id="status">DRIVE MODE</span><span>DRIVEDECK • MUSIC & LYRICS</span></footer>
</main>
<script>
function action(name){if(window.DriveDeckCar&&typeof window.DriveDeckCar.action==='function')window.DriveDeckCar.action(name)}
function render(s){if(!s)return;document.getElementById('title').textContent=s.title||'Waiting for music…';document.getElementById('artist').textContent=s.artist||'Start Spotify or YouTube Music';document.getElementById('source').textContent=s.source||'MEDIA SESSION NOT CONNECTED';document.getElementById('connection').textContent=s.connected?'● MEDIA CONNECTED':'● WAITING FOR MEDIA';document.getElementById('status').textContent=s.status||'DRIVE MODE';document.getElementById('play').textContent=s.playing?'Ⅱ':'▶';const lines=(s.lines||[]).slice(0,3);document.getElementById('lyrics').innerHTML=lines.length?lines.map((t,i)=>'<div class="line '+(i===0?'active':i===1?'next':'')+'"></div>').join(''):'<div class="line active">Lyrics not available yet</div><div class="line next">Try another track</div>';Array.from(document.querySelectorAll('#lyrics .line')).forEach((e,i)=>{if(lines[i])e.textContent=lines[i]});if(s.artwork){document.getElementById('art').innerHTML='<img alt="" src="'+s.artwork.replace(/"/g,'')+'">'}else{document.getElementById('art').textContent='♫'}}
if(window.DriveDeckCar&&typeof window.DriveDeckCar.getState==='function'){try{render(JSON.parse(window.DriveDeckCar.getState()))}catch(e){}}
</script>
</body></html>
