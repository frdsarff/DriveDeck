<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DriveDeck Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#111c2c;--line:#293c54;--cyan:#55dff4;--mint:#54edc4;--muted:#9aacc1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f4f8ff;font:16px system-ui,Roboto,sans-serif}
body{background:radial-gradient(ellipse at 10% 0%,#123b5b 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#073e49 0,transparent 42%),var(--bg)}
#dashboard{height:100%;padding:2.2vh 2.2vw;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:1.1vh 1vw}
.widget{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17283bed,#101a2af2);padding:1.5vh 1.4vw;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px #0003}
.widget>.eyebrow,.playerColumn>.eyebrow,.lyricsHeading{display:none!important}
.eyebrow{font-size:clamp(9px,1.25vh,13px);font-weight:800;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase}
.value{font-size:clamp(18px,4.5vh,58px);font-weight:800;line-height:1.05;letter-spacing:-.04em;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:clamp(10px,1.6vh,17px);color:#b4c4d7;overflow:hidden;text-overflow:ellipsis}
.clock .value{font-size:clamp(30px,6.5vh,82px)}
.clockFace{width:min(22vh,42%);aspect-ratio:1;border:3px solid #55dff4;border-radius:50%;position:relative;align-self:center;background:radial-gradient(circle,#1c3b52,#0d1b2c);box-shadow:0 0 18px #55dff433}
.clockFace:before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--mint);left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.clockHand{position:absolute;left:50%;bottom:50%;width:3px;height:34%;border-radius:4px;background:#f4f8ff;transform-origin:50% 100%;transform:translateX(-50%) rotate(0deg)}.clockHand.minute{height:43%;width:2px;background:var(--mint)}
.clock.clock-style-analog,.clock.clock-style-analog-date{align-items:center;justify-content:center;gap:.8vh}.clock.clock-style-minimal{justify-content:center;gap:.4vh}.clock.clock-style-minimal .value{font-size:clamp(26px,5.6vh,72px);font-weight:500;letter-spacing:.02em}.clock.clock-style-digital{justify-content:center}.clock.clock-style-digital .sub,.clock.clock-style-analog .sub{display:none}
.weather .value{font-size:clamp(25px,5vh,62px)}
.music{display:grid;grid-template-columns:minmax(0,32%) minmax(0,68%);grid-template-rows:1fr;align-items:center;gap:0}
.music>.eyebrow{display:none}
.playerColumn{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8vh;padding-left:.5vw;padding-right:.5vw}
.playerColumn .eyebrow{display:block;align-self:center}
.disc{width:min(100%,19vh);max-height:19vh;aspect-ratio:1;align-self:center;border-radius:13px;background:linear-gradient(135deg,#23607c,#12243a);display:grid;place-items:center;color:var(--cyan);font-size:clamp(22px,4vh,44px);flex:none}
.musicInfo{width:100%;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2vh}
.musicInfo .value{font-size:clamp(16px,3vh,32px);font-weight:700;line-height:1.2;text-align:center;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.musicInfo .sub{font-size:clamp(12px,2vh,21px);line-height:1.25;text-align:center;white-space:normal;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#a9bbcc}
.musicActions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:.5vh;width:100%}
.musicActions button{display:grid;place-items:center;box-sizing:border-box;border:1px solid #3b617b;background:#17334a;color:#eafaff;border-radius:999px;width:clamp(38px,5vh,52px);height:clamp(38px,5vh,52px);min-width:0;font-size:clamp(15px,2.1vh,22px);font-weight:800;padding:0;flex:none}
.musicActions button.primary{background:#1c7180;border-color:#55dff4;width:clamp(42px,5.4vh,56px);height:clamp(42px,5.4vh,56px)}
.lyricsPanel{height:62%;min-width:0;overflow:hidden;border-left:1px solid #29445d;padding:0 1.5vw;display:flex;flex-direction:column;justify-content:center;gap:1.3vh;align-self:center}
.lyricsHeading{font-size:clamp(9px,1.15vh,12px);font-weight:800;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase}
.lyricLine{font-size:var(--lyrics-font-size,25px);line-height:1.35;color:#8fa6bd;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:1.35em}
.lyricLine.active{font-size:var(--lyrics-active-font-size,32px);font-weight:750;color:var(--mint);text-shadow:0 0 18px #54edc433}
.lyricLine.next{color:#d5e2ef}
.lyricsEmpty{font-size:clamp(12px,1.8vh,18px);color:#8fa6bd;line-height:1.5}
@media(max-width:700px){.music{grid-template-columns:32% 68%;gap:0}.playerColumn{padding-left:.3vw;padding-right:.3vw}.musicActions{gap:5px}.musicActions button{width:clamp(30px,4.2vh,42px);height:clamp(30px,4.2vh,42px)}.musicActions button.primary{width:clamp(34px,4.6vh,46px);height:clamp(34px,4.6vh,46px)}.lyricsPanel{padding:0 1vw}}
.shortcuts{justify-content:flex-start;gap:1.2vh;min-height:0}.appGrid{display:flex;flex-direction:row;align-items:stretch;justify-content:flex-start;gap:1vw;flex:1;min-height:0;overflow:hidden}.appTile{position:relative;display:grid;place-items:center;flex:0 0 auto;width:auto;height:100%;max-height:100%;aspect-ratio:1;min-width:0;max-width:none;border:1px solid #3b617b;border-radius:13px;background:linear-gradient(145deg,#253d55,#142438);color:#fff;text-decoration:none;overflow:hidden;padding:0}.youtubeIcon{display:block!important;position:absolute;left:10%;top:10%;width:80%!important;height:80%!important;min-width:80%;min-height:80%;max-width:none;max-height:none;flex:none;overflow:visible}.appTile:active{transform:scale(.96);background:#1b7180}
.weatherDetails{display:flex;gap:1.2em;flex-wrap:wrap;font-size:clamp(9px,1.3vh,13px);color:#b4c4d7}
#footer{position:absolute;bottom:3px;right:1vw;font-size:8px;color:#73879d;letter-spacing:.1em;pointer-events:none}
</style>
</head>
<body>
<main id="dashboard">
<section class="widget clock clock-style-digital-date" style="grid-column:1 / span 4;grid-row:1 / span 2"><div class="value" id="liveClock">--:--</div><div class="sub" id="liveDate">Loading date…</div></section>
<section class="widget weather" style="grid-column:5 / span 4;grid-row:1 / span 2"><div class="value">—</div><div class="sub">Weather loading…</div></section>
<section class="widget music" style="grid-column:9 / span 4;grid-row:1 / span 2"><div class="playerColumn"><div class="disc">♫</div><div class="musicInfo"><div class="value">No track playing</div><div class="sub">Start Spotify or YouTube Music</div></div><div class="musicActions"><button disabled>|◀</button><button class="primary" disabled>▶</button><button disabled>▶|</button></div></div><div class="lyricsPanel"><div class="lyricsEmpty">Lyrics will appear here</div></div></section>
<section class="widget shortcuts" style="grid-column:1 / span 6;grid-row:3 / span 2"><div class="appGrid"><a class="appTile" href="#" aria-label="YouTube Web"><svg class="youtubeIcon" viewBox="0 0 48 34" aria-hidden="true"><rect x="1" y="1" width="46" height="32" rx="9" fill="#ff0033"/><path d="M20 10.5L32 17 20 23.5Z" fill="white"/></svg></a></div></section>
</main><div id="footer"></div>
<script>
const DEFAULT={widgets:[
{id:'clock-1',type:'clock',x:0,y:0,w:4,h:2},
{id:'weather-1',type:'weather',x:4,y:0,w:4,h:2},
{id:'music-1',type:'music',x:8,y:0,w:4,h:2},
{id:'shortcuts-1',type:'shortcuts',x:0,y:2,w:6,h:2}
]};
const DATA={
clock:['LOCAL TIME'],weather:['WEATHER'],music:['NOW PLAYING'],shortcuts:['APPS']
};
const ALLOWED=new Set(['clock','weather','music','shortcuts']);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function validWidget(w){
 if(!w||!ALLOWED.has(w.type))return false;
 const x=Number(w.x),y=Number(w.y),width=Number(w.w),height=Number(w.h);
 return Number.isInteger(x)&&Number.isInteger(y)&&Number.isInteger(width)&&Number.isInteger(height)&&x>=0&&y>=0&&width>=2&&height>=2&&x+width<=12&&y+height<=8;
}
function cleanLayout(raw){
 const source=raw&&raw.dashboardLayout&&Array.isArray(raw.dashboardLayout.widgets)?raw.dashboardLayout:DEFAULT;
 const accepted=[];
 for(const item of source.widgets){
  if(!validWidget(item))continue;
  const candidate={id:String(item.id||item.type+'-'+accepted.length),type:item.type,style:item.type==='clock'&&['digital-date','digital','analog-date','analog','minimal'].includes(item.style)?item.style:'digital-date',color:typeof item.color==='string'&&/^#[0-9a-f]{6}$/i.test(item.color)?item.color:'',opacity:Number.isFinite(Number(item.opacity))?Math.max(0,Math.min(100,Number(item.opacity))):100,x:Number(item.x),y:Number(item.y),w:Number(item.w),h:Number(item.h)};
  const overlaps=accepted.some(a=>candidate.x<a.x+a.w&&candidate.x+candidate.w>a.x&&candidate.y<a.y+a.h&&candidate.y+candidate.h>a.y);
  if(!overlaps)accepted.push(candidate);
 }
 return accepted.length?accepted:DEFAULT.widgets;
}
function colorRgba(hex,alpha){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,alpha))+')'}
function widgetMarkup(w,s){
 let body='';
 if(w.type==='clock'){const style=['digital-date','digital','analog-date','analog','minimal'].includes(w.style)?w.style:'digital-date';if(style==='analog'||style==='analog-date')body='<div class="clockFace"><span class="clockHand hour" id="clockHour"></span><span class="clockHand minute" id="clockMinute"></span></div><div class="value" id="liveClock" style="display:none">--:--</div>'+(style==='analog-date'?'<div class="sub" id="liveDate">Loading date…</div>':'');else body='<div class="value" id="liveClock">--:--</div>'+(style==='digital'||style==='minimal'? (style==='minimal'?'<div class="sub" id="liveDate">Loading date…</div>':'') : '<div class="sub" id="liveDate">Loading date…</div>');}
 else if(w.type==='weather'){
  const ready=!!(s&&s.weatherReady),temp=ready?(s.weatherTemperature||'—'):'—';
  const desc=ready?(s.weatherDescription||'Current conditions'):'Enable location in phone settings';
  const place=ready?(s.weatherLocation||'Current location'):'';
  const extra=ready?'<div class="weatherDetails"><span>Feels '+esc(s.weatherFeelsLike||'—')+'</span><span>Humidity '+esc(s.weatherHumidity||'—')+'%</span><span>Wind '+esc(s.weatherWind||'—')+'</span></div>':'';
  body='<div class="value">'+esc(temp)+'</div><div class="sub">'+esc(desc)+(place?' • '+esc(place):'')+'</div>'+extra;
 }else if(w.type==='music'){
  const showMetadata=!(s&&s.showMetadata===false),showLyrics=!(s&&s.showLyrics===false);
  const title=showMetadata?(s&&s.musicTitle?s.musicTitle:'No track playing'):'Music controls';
  const artist=showMetadata?(s&&s.musicArtist?s.musicArtist:'Start Spotify or YouTube Music'):'Track details hidden in settings';
  const playing=!!(s&&s.musicIsPlaying);
  body='<div class="playerColumn"><div class="eyebrow">NOW PLAYING</div><div class="disc">♫</div><div class="musicInfo"><div class="value">'+esc(title)+'</div><div class="sub">'+esc(artist)+'</div></div><div class="musicActions"><button onclick="musicAction(\'previous\')" aria-label="Previous">|◀</button><button class="primary" onclick="musicAction(\'playPause\')" aria-label="Play or pause">'+(playing?'Ⅱ':'▶')+'</button><button onclick="musicAction(\'next\')" aria-label="Next">▶|</button></div></div><div class="lyricsPanel" id="lyricsPanel">'+(showLyrics?'<div class="lyricsHeading">LYRICS</div><div class="lyricLine" id="lyricPrevious"></div><div class="lyricLine active" id="lyricCurrent">'+(playing?'♪ Playing':'Lyrics will appear here')+'</div><div class="lyricLine next" id="lyricNext"></div>':'<div class="lyricsEmpty">Lyrics hidden in settings</div>')+'</div>';
 }else if(w.type==='shortcuts')body='<div class="appGrid"><a class="appTile" href="#" onclick="openYoutubeWeb(event)" aria-label="YouTube Web" title="YouTube Web"><svg class="youtubeIcon" viewBox="0 0 48 34" aria-hidden="true"><rect x="1" y="1" width="46" height="32" rx="9" fill="#ff0033"/><path d="M20 10.5L32 17 20 23.5Z" fill="white"/></svg></a></div>';
 const appearance=w.color?'background-color:'+colorRgba(w.color,w.opacity/100)+';background-image:none;':'';
 return '<section class="widget '+w.type+(w.type==='clock'?' clock-style-'+(w.style||'digital-date'):'')+'" style="grid-column:'+(w.x+1)+' / span '+w.w+';grid-row:'+(w.y+1)+' / span '+w.h+';'+appearance+'"><div class="eyebrow">'+DATA[w.type][0]+'</div>'+body+'</section>';
}
let latestState={};
function updateLyrics(){
 const previous=document.getElementById('lyricPrevious'),current=document.getElementById('lyricCurrent'),next=document.getElementById('lyricNext');
 if(!current||!latestState||latestState.showLyrics===false)return;
 const raw=String(latestState.musicSyncedLyrics||'');
 const entries=[];
 for(const line of raw.split(/\r?\n/)){
  const m=line.match(/^\[(\d{2}):(\d{2})(?:\.(\d{1,3}))?\](.*)$/);
  if(!m)continue;
  const ms=(Number(m[1])*60+Number(m[2]))*1000+Number((m[3]||'0').padEnd(3,'0'));
  const value=m[4].trim();
  if(value)entries.push({ms:ms,text:value});
 }
 if(!entries.length){previous.textContent='';current.textContent=latestState.musicLyrics||'No synced lyrics available';next.textContent='';return;}
 const elapsed=performance.now()-(latestState._receivedAt||performance.now());
 const pos=Number(latestState.musicPositionMs||0)+(latestState.musicIsPlaying?elapsed*Number(latestState.musicPlaybackSpeed||0):0);
 let active=-1;
 for(let i=0;i<entries.length;i++){if(entries[i].ms<=pos)active=i;else break;}
 previous.textContent=active>0?entries[active-1].text:'';
 current.textContent=active>=0?entries[active].text:'♪';
 next.textContent=active+1<entries.length?entries[active+1].text:'';
}
function openYoutubeWeb(event){if(event)event.preventDefault();try{if(window.DriveDeckCar&&DriveDeckCar.openYoutubeWeb)DriveDeckCar.openYoutubeWeb()}catch(e){console.error('Unable to open YouTube Web',e)}}
function musicAction(name){try{if(window.DriveDeckCar&&DriveDeckCar.action)DriveDeckCar.action(name)}catch(e){console.error('Music command failed',e)}}
function updateClock(){
 const now=new Date(),clock=document.getElementById('liveClock'),date=document.getElementById('liveDate');
 if(clock)clock.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}).format(now);
 if(date)date.textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long'}).format(now);
 const hour=document.getElementById('clockHour'),minute=document.getElementById('clockMinute');if(hour)hour.style.transform='translateX(-50%) rotate('+(now.getHours()%12*30+now.getMinutes()*.5)+'deg)';if(minute)minute.style.transform='translateX(-50%) rotate('+(now.getMinutes()*6)+'deg');
}
function render(s){
 latestState=Object.assign({},s||{},{_receivedAt:performance.now()});
 const lyricSize=Math.max(14,Math.min(36,Number(latestState.lyricsFontSize)||25));
 document.documentElement.style.setProperty('--lyrics-font-size',lyricSize+'px');
 document.documentElement.style.setProperty('--lyrics-active-font-size',Math.round(lyricSize*1.28)+'px');
 const widgets=cleanLayout(s);
 document.getElementById('dashboard').innerHTML=widgets.map(w=>widgetMarkup(w,s||{})).join('');
 document.getElementById('footer').textContent='DRIVEDECK • CUSTOM DASHBOARD • '+(s&&s.width?s.width+'×'+s.height:'');
 updateClock();
 updateLyrics();
}
// Paint a usable dashboard immediately; native state can replace it once the bridge responds.
render({dashboardLayout:DEFAULT});
try{
 if(window.DriveDeckCar&&typeof DriveDeckCar.getState==='function'){
  const nativeState=JSON.parse(DriveDeckCar.getState());
  render(nativeState);
 }else{
  console.warn('DriveDeckCar bridge unavailable; keeping default dashboard visible');
 }
}catch(e){
 console.error('DriveDeck dashboard state load failed; keeping default dashboard visible',e);
}
setInterval(updateClock,1000);
setInterval(updateLyrics,250);
</script>
</body>
</html>
