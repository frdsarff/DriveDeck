<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DriveDeck Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#111c2c;--line:#293c54;--cyan:#55dff4;--mint:#54edc4;--muted:#9aacc1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f4f8ff;font:16px system-ui,Roboto,sans-serif}body{background:radial-gradient(ellipse at 10% 0%,#123b5b 0,transparent 48%),radial-gradient(ellipse at 100% 100%,#073e49 0,transparent 42%),var(--bg)}#dashboard{height:100%;padding:2.2vh 2.2vw;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:1.1vh 1vw}.widget{min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#17283bed,#101a2af2);padding:1.5vh 1.4vw;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px #0003}.eyebrow{font-size:clamp(9px,1.25vh,13px);font-weight:800;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase}.value{font-size:clamp(22px,5vh,58px);font-weight:800;line-height:1.05;letter-spacing:-.04em}.sub{font-size:clamp(10px,1.6vh,17px);color:#b4c4d7}.clock .value{font-size:clamp(34px,7vh,82px)}.weather .value{font-size:clamp(28px,5.5vh,62px)}.air .value{color:#f1a5b7}.prayer .times{display:flex;justify-content:space-between;gap:8px;font-size:clamp(10px,1.7vh,17px);color:#e4edf7}.prayer .times b{display:block;color:var(--cyan);font-size:1.1em}.music{flex-direction:row;align-items:center;gap:1vw}.disc{width:22%;max-height:100%;aspect-ratio:1;border-radius:13px;background:linear-gradient(135deg,#23607c,#12243a);display:grid;place-items:center;color:var(--cyan);font-size:clamp(22px,4vh,44px)}.musicInfo{min-width:0;flex:1}.musicInfo .value{font-size:clamp(15px,2.7vh,29px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.musicInfo .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sports .value{font-size:clamp(17px,3vh,32px)}.shortcuts .icons{display:flex;gap:10px;align-items:center;font-size:clamp(18px,3.4vh,36px);color:var(--cyan)}.map .value{font-size:clamp(18px,3vh,32px)}#footer{position:absolute;bottom:3px;right:1vw;font-size:8px;color:#73879d;letter-spacing:.1em}
</style></head><body><main id="dashboard"></main><div id="footer"></div>
<script>
const DEFAULT={widgets:[{id:'clock-1',type:'clock',x:0,y:0,w:4,h:2},{id:'weather-1',type:'weather',x:4,y:0,w:4,h:2},{id:'air-1',type:'air',x:8,y:0,w:4,h:2},{id:'prayer-1',type:'prayer',x:0,y:2,w:6,h:2},{id:'music-1',type:'music',x:6,y:2,w:6,h:2}]};
const DATA={
clock:['LOCAL TIME','04:44','Thursday • 5 November'],
weather:['WEATHER','29°','Partly cloudy • Selangor'],
air:['AIR QUALITY','42','Good • PM2.5 low'],
prayer:['PRAYER TIMES','Next prayer • Maghrib','Subuh 05:48  •  Zohor 12:58  •  Asar 16:15  •  Maghrib 19:05'],
music:['NOW PLAYING','No track playing','Open Spotify or YouTube Music'],
sports:['SPORTS','Live scores','Your teams and match updates'],
shortcuts:['QUICK APPS','Shortcuts','Maps  •  Music  •  Phone'],
map:['NEARBY','Nearby places','Search around your current route']
};
function widgetMarkup(w){const d=DATA[w.type]||DATA.clock;let cls=w.type,body='';if(w.type==='prayer')body='<div class="times"><span><b>05:48</b>Subuh</span><span><b>12:58</b>Zohor</span><span><b>16:15</b>Asar</span><span><b>19:05</b>Maghrib</span><span><b>20:16</b>Isyak</span></div>';else if(w.type==='music')body='<div class="disc">♫</div><div class="musicInfo"><div class="value">No track playing</div><div class="sub">Spotify • YouTube Music</div></div>';else if(w.type==='shortcuts')body='<div class="icons">▣　♫　⌖　☎</div>';else body='<div class="value">'+d[1]+'</div><div class="sub">'+d[2]+'</div>';return '<section class="widget '+cls+'" style="grid-column:'+(w.x+1)+' / span '+w.w+';grid-row:'+(w.y+1)+' / span '+w.h+'"><div class="eyebrow">'+d[0]+'</div>'+body+'</section>'}
function render(s){const cfg=s&&s.dashboardLayout&&Array.isArray(s.dashboardLayout.widgets)?s.dashboardLayout:DEFAULT;document.getElementById('dashboard').innerHTML=cfg.widgets.map(widgetMarkup).join('');document.getElementById('footer').textContent='DRIVEDECK • CUSTOM DASHBOARD • '+(s&&s.width?s.width+'×'+s.height:'')}
try{if(window.DriveDeckCar&&DriveDeckCar.getState)render(JSON.parse(DriveDeckCar.getState()));else render({dashboardLayout:DEFAULT})}catch(e){render({dashboardLayout:DEFAULT})}setInterval(updateClock,1000);
</script></body></html>
