<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveDeck 2.0</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; background: #101218; color: #f4f6fa; }
main { width: min(100%, 560px); padding: 28px; border-radius: 24px; background: #1b202b; border: 1px solid #30394a; }
.kicker { color: #9caac0; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
h1 { margin: 12px 0; font-size: 32px; }
p { color: #c4ccda; line-height: 1.55; }
.card { margin-top: 12px; padding: 16px; border-radius: 16px; background: #252d3b; }
</style>
</head>
<body>
<main>
  <div class="kicker">Version 2.0.0 · Starter</div>
  <h1>DriveDeck</h1>
  <p>Clean rebuild started. This is the phone-side HTML preview; the car display currently uses supported Android Auto templates.</p>
  <div class="card">01 — Android Auto foundation</div>
  <div class="card">02 — Custom web UI</div>
  <div class="card">03 — Media and navigation integrations</div>
</main>
</body>
</html>
